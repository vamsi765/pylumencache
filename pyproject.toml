[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylumencache"
version = "0.0.1"
description = "Unofficial Python client for LumenCache ReNetA lighting"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vamsi Krishna Adsumilli" }]
keywords = ["lumencache", "reneta", "lighting", "mqtt", "home-assistant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiomqtt>=2.0"]

[project.urls]
Homepage = "https://github.com/vamsi765/pylumencache"
Issues = "https://github.com/vamsi765/pylumencache/issues"
Integration = "https://github.com/vamsi765/ha-lumencache"

[project.optional-dependencies]
capture = ["paho-mqtt"]
dev = ["pyyaml", "jsonschema", "paho-mqtt", "pytest", "ruff", "mypy", "types-PyYAML", "import-linter"]

[tool.hatch.build.targets.wheel]
packages = ["src/pylumencache"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["capture*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pylumencache/transports/mqtt/wire/commands.py" = ["E501"]   # generated
"src/pylumencache/transports/mqtt/wire/models.py" = ["E501"]     # generated

[tool.mypy]
strict = true
files = ["src"]

[tool.importlinter]
root_package = "pylumencache"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: a module may import only from the layers below it"
type = "layers"
layers = [
    "pylumencache.api",
    "pylumencache.transports",
    "pylumencache.transport",
    "pylumencache.domain",
]

[[tool.importlinter.contracts]]
name = "Only the MQTT transport touches aiomqtt"
type = "forbidden"
source_modules = ["pylumencache.api", "pylumencache.transport", "pylumencache.domain"]
forbidden_modules = ["aiomqtt"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "MQTT transport: client above adapter above wire format"
type = "layers"
layers = [
    "pylumencache.transports.mqtt.client",
    "pylumencache.transports.mqtt.adapter",
    "pylumencache.transports.mqtt.wire",
]

[[tool.importlinter.contracts]]
name = "The fallback transport does not depend on any particular transport"
type = "forbidden"
source_modules = ["pylumencache.transports.fallback"]
forbidden_modules = ["pylumencache.transports.mqtt"]
