# AsyncAPI description of the ReNetA MQTT protocol (version 3.0 of the spec).
#
# This file is the one place for message codes, payload shapes and what has been
# observed. docs/protocol.md explains the protocol in prose and has its code tables
# generated from this file: edit here, then run tools/gen_protocol.py (CI runs it
# with --check).
#
# Our own metadata uses AsyncAPI "x-" extension fields:
#   x-code          the "e" value of the message
#   x-documented    the message is in LumenCache's Commands List (title = summary, notes = description)
#   x-uses-store    the documented example persists with "store":1
#   x-danger        payload matches that need confirmation before sending
#   x-seen          what appeared in captures: {as, text}, one row of "Codes seen"
#   x-tried         commands sent by hand and what came back (section 6 of protocol.md)
#   x-names         on a field schema: the JSON field names it applies to
#
# Whether a command field is required is unknown unless the documentation says so,
# so command payloads require only "e". Quote any key that YAML 1.1 reads as a
# boolean (on, off, yes, no); tools/gen_protocol.py rejects them.

asyncapi: 3.0.0
info:
  title: LumenCache ReNetA MQTT
  version: 0.2.0
  description: Observed MQTT protocol of a LumenCache ReNetA lighting system. Not an official specification; written
    from captures of one system and LumenCache's Commands List. docs/protocol.md explains it in prose and has its
    code tables generated from this file.
servers:
  production:
    host: '{host}:8883'
    protocol: mqtts
    description: Hosted EMQX broker issued by LumenCache. TLS with a valid certificate; MQTT 5 works.
    variables:
      host:
        description: Broker hostname from your LumenCache connection details
    security:
    - $ref: '#/components/securitySchemes/credentials'
channels:
  cmd:
    address: '{prefix}/cmd'
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
    description: Commands from the client. The broker echoes every command back to a subscribed client.
    messages:
      ping:
        $ref: '#/components/messages/ping'
      hail:
        $ref: '#/components/messages/hail'
      config:
        $ref: '#/components/messages/config'
      heartbeatRequest:
        $ref: '#/components/messages/heartbeatRequest'
      statusPull:
        $ref: '#/components/messages/statusPull'
      rebootOrReset:
        $ref: '#/components/messages/rebootOrReset'
      cardMode:
        $ref: '#/components/messages/cardMode'
      setGid:
        $ref: '#/components/messages/setGid'
      currentAndDefaults:
        $ref: '#/components/messages/currentAndDefaults'
      zoneManagement:
        $ref: '#/components/messages/zoneManagement'
      zoneControl:
        $ref: '#/components/messages/zoneControl'
      directControl:
        $ref: '#/components/messages/directControl'
      emptyMessage:
        $ref: '#/components/messages/emptyMessage'
  status:
    address: '{prefix}/status'
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
    messages:
      heartbeat:
        $ref: '#/components/messages/heartbeat'
      zoneEvent:
        $ref: '#/components/messages/zoneEvent'
      errorReport:
        $ref: '#/components/messages/errorReport'
  errors:
    address: '{prefix}/errors'
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
    messages:
      errorReport:
        $ref: '#/components/messages/errorReport'
  meta:
    address: '{prefix}/meta'
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
    messages:
      systemInfo:
        $ref: '#/components/messages/systemInfo'
      hailReply:
        $ref: '#/components/messages/hailReply'
      switchConfig:
        $ref: '#/components/messages/switchConfig'
  dev:
    address: '{prefix}/dev/{path}'
    parameters:
      prefix:
        $ref: '#/components/parameters/prefix'
      path:
        description: Device path, for example pp:1/pdm:2/skt:4/scard:14
    messages:
      deviceAnnouncement:
        $ref: '#/components/messages/deviceAnnouncement'
operations:
  sendPing:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/ping'
  sendHail:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/hail'
  sendConfig:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/config'
  sendHeartbeatRequest:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/heartbeatRequest'
  sendStatusPull:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/statusPull'
  sendRebootOrReset:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/rebootOrReset'
  sendCardMode:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/cardMode'
  sendSetGid:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/setGid'
  sendCurrentAndDefaults:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/currentAndDefaults'
  sendZoneManagement:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/zoneManagement'
  sendZoneControl:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/zoneControl'
  sendDirectControl:
    action: send
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/directControl'
  receiveHeartbeat:
    action: receive
    channel:
      $ref: '#/channels/status'
    messages:
    - $ref: '#/channels/status/messages/heartbeat'
  receiveZoneEvent:
    action: receive
    channel:
      $ref: '#/channels/status'
    messages:
    - $ref: '#/channels/status/messages/zoneEvent'
  receiveErrorOnStatus:
    action: receive
    channel:
      $ref: '#/channels/status'
    messages:
    - $ref: '#/channels/status/messages/errorReport'
  receiveErrorOnErrors:
    action: receive
    channel:
      $ref: '#/channels/errors'
    messages:
    - $ref: '#/channels/errors/messages/errorReport'
  receiveSystemInfo:
    action: receive
    channel:
      $ref: '#/channels/meta'
    messages:
    - $ref: '#/channels/meta/messages/systemInfo'
  receiveHailReply:
    action: receive
    channel:
      $ref: '#/channels/meta'
    messages:
    - $ref: '#/channels/meta/messages/hailReply'
  receiveDeviceAnnouncement:
    action: receive
    channel:
      $ref: '#/channels/dev'
    messages:
    - $ref: '#/channels/dev/messages/deviceAnnouncement'
  receiveEmptyMessage:
    action: receive
    channel:
      $ref: '#/channels/cmd'
    messages:
    - $ref: '#/channels/cmd/messages/emptyMessage'
  receiveSwitchConfig:
    action: receive
    channel:
      $ref: '#/channels/meta'
    messages:
    - $ref: '#/channels/meta/messages/switchConfig'
components:
  securitySchemes:
    credentials:
      type: userPassword
      description: Username and password issued by LumenCache
  parameters:
    prefix:
      description: The Prefix Topic issued by LumenCache, a path such as platform:na/<state>/<id>. All topics sit
        under it.
  schemas:
    Gid:
      type: integer
      description: Device address (GID). Set with `e:32`
      x-names: [g, gid]
    ZoneId:
      type: integer
      description: Zone ID. Membership is set with `e:49`
      x-names: [z, zid]
    Hsn:
      type: string
      description: Permanent per-device serial, used before the device has a GID
      x-names: [hsn]
    Brightness:
      type: number
      description: Brightness, 0 to 100. A decimal (12.5) sent to GID 100 was accepted and the light dimmed from
        50 (confirmed by eye); whether the 0.1% steps the plan wants are honored cannot be told by eye. 🔬 Out-of-range
        values (500 was sent) are unconfirmed
      x-names: [bri]
      minimum: 0
      maximum: 100
      x-unit: percent
    ColorTemperature:
      type: integer
      description: Color temperature in kelvin
      x-names: [cct]
      x-unit: kelvin
    Fade:
      type: integer
      description: Transition time in milliseconds
      x-names: [fade]
      x-unit: ms
    DriveCurrent:
      type: integer
      description: Drive current in milliamps
      x-names: [ma]
      x-unit: mA
    Store:
      type: integer
      description: 1 saves the setting through a reboot; without it the setting reverts
      x-names: [store]
    Action:
      type: integer
      description: Action code inside a multi-purpose command (`e:49`)
      x-names: [a]
    SubCode:
      type: integer
      description: 'Sub-code (`e:15`: 0 reboot, 1 factory reset)'
      x-names: [c]
    CardMode:
      type: integer
      description: Socket card mode (`e:18`)
      x-names: [cm]
    PowerPlaneHeartbeat:
      type: object
      required: [e, g, hsn, swv, hwv, time, heap]
      properties:
        e:
          const: 139
        g:
          type: integer
          description: GID of the PowerPlane
        hsn:
          type: string
        swv:
          type: string
        hwv:
          type: string
        time:
          type: integer
          description: Uptime in milliseconds
        heap:
          type: integer
          description: Free memory (bytes). Unit inferred
      additionalProperties: false
      description: Every 5 minutes. After a boot the first one arrives 300 s later. Required and additional fields
        describe what every heartbeat of this kind carried, which also tells the shapes apart.
    PdmHeartbeat:
      type: object
      required: [e, g, bay, hsn, swv, hwv, time, heap, temp, rh]
      properties:
        e:
          const: 139
        g:
          type: integer
          description: GID of the PDM
        bay:
          type: integer
          description: Unknown (3 in every heartbeat)
        hsn:
          type: string
        swv:
          type: string
        hwv:
          type: string
        time:
          type: integer
          description: Uptime in milliseconds
        heap:
          type: integer
        temp:
          type: number
          description: Degrees Celsius. Unit inferred
        rh:
          type: number
          description: Relative humidity in percent. Unit inferred
      description: Every 60 s.
    ControllerHeartbeat:
      type: object
      required: [e, g, opc, mode, 12v, term, heap, txrx, uptime, temp]
      properties:
        e:
          const: 139
        g:
          type: integer
          description: 100 for the controller. GIDs 101 and 0 send the same shape; none of the three is in the inventory
            (inferred to be nodes of the same kind)
        opc:
          type: integer
        mode:
          type: integer
        12v:
          type: integer
          x-py-name: v12
        term:
          type: integer
        heap:
          type: integer
        txrx:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
          description: Unknown. Possibly traffic counters since the last heartbeat
        uptime:
          type: integer
          description: Uptime in seconds
        temp:
          type: number
      description: 'GID 100: not periodic, sent after boot and in the minutes after a light command, with widening
        gaps. GIDs 101 and 0: one heartbeat each, at about 10 hours of uptime.'
    SwitchHeartbeat:
      type: object
      required: [e, g, uirgb, term, heap, txrx, uptime]
      properties:
        e:
          const: 139
        g:
          type: integer
          description: GID of the wall switch
        uirgb:
          type: string
          description: 'LED color of the switch, as #RRGGBB'
        term:
          type: integer
        heap:
          type: integer
        txrx:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
          description: Unknown
        uptime:
          type: integer
          description: Uptime in seconds
      description: One seen, at about 10 hours of uptime. The normal rhythm is unknown.
  messages:
    ping:
      name: ping
      title: Ping
      summary: Ping
      description: '"Are you there" check for a GID'
      x-code: 8
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 8
          g:
            $ref: '#/components/schemas/Gid'
      examples:
      - payload: {e: 8, g: 54}
      x-tried:
      - sent: '`g` 54, 2 and 14'
        result: No reply
      x-seen:
        as: command on `cmd`
        text: Only the echo and the empty message followed (section 6)
    hail:
      name: hail
      title: Hail / GID lookup
      summary: Hail / GID lookup
      description: Returns what device sits at that GID. With `g:0`, lists devices still at GID 0 by `hsn`
      x-code: 9
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 9
          g:
            $ref: '#/components/schemas/Gid'
      examples:
      - payload: {e: 9, g: 54}
      x-tried:
      - sent: '`g` 0 (hail)'
        result: 'One reply: `e:137` on `meta` (section 5.4). An earlier hail got no reply'
      - sent: '`g` 54, twice; `g` 14'
        result: No reply
      x-seen:
        as: command on `cmd`
        text: 'Hail: `{"e":9,"g":0}` lists devices still at GID 0. It answered once, as `e:137` on `meta` (section
          5.4). `e:9` with a GID (54, 14) got no reply'
    config:
      name: config
      title: Config
      summary: Config
      description: Dumps the device's current configuration. 🔬 Reply format
      x-code: 10
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 10
          g:
            $ref: '#/components/schemas/Gid'
      examples:
      - payload: {e: 10, g: 54}
      x-tried:
      - sent: '`g` 12 (a wall switch)'
        result: 'One reply: `e:138` on `meta` (section 5.5)'
      - sent: '`g` 54, 2, 14, 1, 3 and 15'
        result: No reply
      x-seen:
        as: command on `cmd`
        text: Replied only for a wall switch (`e:138` on `meta`, section 5.5). No reply for GIDs 1, 2, 3, 14 or
          15
    heartbeatRequest:
      name: heartbeatRequest
      title: Heartbeat request
      summary: Heartbeat request
      description: Checks the device is still checking in
      x-code: 11
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 11
          g:
            $ref: '#/components/schemas/Gid'
      examples:
      - payload: {e: 11, g: 54}
      x-tried:
      - sent: '`g` 54, 2 and 1'
        result: No reply, and no extra heartbeat
      x-seen:
        as: command on `cmd`
        text: Only the echo and the empty message followed (section 6)
    statusPull:
      name: statusPull
      title: Status pull
      summary: Status pull
      description: Forces the device to report status now, instead of waiting for the automatic push on `status`
      x-code: 13
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 13
          g:
            $ref: '#/components/schemas/Gid'
      examples:
      - payload: {e: 13, g: 54}
      x-tried:
      - sent: '`g` 54, 2, 14, 1 and 15'
        result: No reply, and no extra status
      x-seen:
        as: command on `cmd`
        text: Only the echo and the empty message followed (section 6)
    rebootOrReset:
      name: rebootOrReset
      title: Reboot / factory reset
      summary: Reboot / factory reset
      description: '`c` is the sub-code. Destructive'
      x-code: 15
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 15
          g:
            $ref: '#/components/schemas/Gid'
          c:
            $ref: '#/components/schemas/SubCode'
          store:
            $ref: '#/components/schemas/Store'
      examples:
      - name: reboot
        payload: {e: 15, g: 54, c: 0}
      - name: factory reset
        payload: {e: 15, g: 54, c: 1, store: 1}
      x-uses-store: true
      x-danger:
      - when: {c: 1}
        level: confirm
        reason: factory reset
      x-seen:
        as: command on `cmd`
        text: 'Reboot (`c:0`) sent to GIDs 14, 2 and 1: only the echo and the empty message followed, and the PDM
          and PowerPlane did not restart (section 6)'
      x-tried:
      - sent: '`g` 14, 2 and 1, `c` 0 (reboot)'
        result: 'No reply, and no visible reboot: the PDM''s and PowerPlane''s uptimes kept counting and the inventory
          was not republished. 🔬 Effect on the card (GID 14) not reported'
    cardMode:
      name: cardMode
      title: Card mode
      summary: Card mode
      description: Sets a socket card's operating mode. 🔬 Mode values
      x-code: 18
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 18
          g:
            $ref: '#/components/schemas/Gid'
          cm:
            $ref: '#/components/schemas/CardMode'
      examples:
      - payload: {e: 18, g: 54, cm: 3}
    setGid:
      name: setGid
      title: Set GID
      summary: Set GID
      description: Gives that `hsn` the address 60
      x-code: 32
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 32
          gid:
            $ref: '#/components/schemas/Gid'
          hsn:
            $ref: '#/components/schemas/Hsn'
          store:
            $ref: '#/components/schemas/Store'
      examples:
      - payload: {e: 32, gid: 60, hsn: <hsn>, store: 1}
      x-uses-store: true
    currentAndDefaults:
      name: currentAndDefaults
      title: Current and defaults
      summary: Current and defaults
      description: Sets drive current in mA. The text also mentions stored warm, cool, brightness and CCT defaults.
        🔬 Their field names
      x-code: 36
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 36
          g:
            $ref: '#/components/schemas/Gid'
          ma:
            $ref: '#/components/schemas/DriveCurrent'
          store:
            $ref: '#/components/schemas/Store'
      examples:
      - payload: {e: 36, g: 54, ma: 700, store: 1}
      x-uses-store: true
    zoneManagement:
      name: zoneManagement
      title: Zone management
      summary: Zone management
      description: '`a` is the action: 5 add (with optional zone defaults `bri` and `cct`), 6 delete, 9 list zones
        (example `{"e":49,"g":54,"a":9}`). The text also mentions "inspect". 🔬 Other actions, and how to list the
        members of a zone'
      x-code: 49
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 49
          g:
            $ref: '#/components/schemas/Gid'
          a:
            $ref: '#/components/schemas/Action'
          zid:
            $ref: '#/components/schemas/ZoneId'
          bri:
            $ref: '#/components/schemas/Brightness'
          cct:
            $ref: '#/components/schemas/ColorTemperature'
          store:
            $ref: '#/components/schemas/Store'
      examples:
      - payload: {e: 49, g: 54, a: 5, zid: 200, bri: 75, cct: 3000, store: 1}
      x-uses-store: true
      x-tried:
      - sent: '`g` 2 and 1, `a` 9 (list zones)'
        result: No reply
      x-seen:
        as: command on `cmd`
        text: '`{"e":49,"g":2,"a":9}` and `{"e":49,"g":1,"a":9}` (list zones) got no reply'
    zoneControl:
      name: zoneControl
      title: Zone control
      summary: Zone control
      description: Whole zone at once. The tutorial's sliders send `{"e":56,"z":<zone>,"bri":<0-100>}`, and `bri`
        0 turns the zone off
      x-code: 56
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 56
          z:
            $ref: '#/components/schemas/ZoneId'
          bri:
            $ref: '#/components/schemas/Brightness'
          cct:
            $ref: '#/components/schemas/ColorTemperature'
          fade:
            $ref: '#/components/schemas/Fade'
      examples:
      - payload: {e: 56, z: 200, bri: 50, cct: 4000, fade: 800}
      x-tried:
      - sent: '`z` 250; `bri` 10, 50 and 100; `cct` 3000 and 4000; `fade` 800'
        result: 'Worked: brightness and color temperature followed, with the fade (confirmed by eye). No reply and
          no `e:56` status event'
    directControl:
      name: directControl
      title: Direct control
      summary: Direct control
      description: One socket card
      x-code: 57
      x-documented: true
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 57
          g:
            $ref: '#/components/schemas/Gid'
          bri:
            $ref: '#/components/schemas/Brightness'
          cct:
            $ref: '#/components/schemas/ColorTemperature'
          fade:
            $ref: '#/components/schemas/Fade'
          z:
            $ref: '#/components/schemas/ZoneId'
      examples:
      - payload: {e: 57, g: 54, bri: 100, cct: 3000, fade: 1000}
      x-tried:
      - sent: '`g` 100, 14, 10 and 0; `bri` 0, 10, 12.5, 50, 100 and 500; `cct` 2700 to 5000; `fade` 800 and 1000'
        result: To GID 100 the lights changed to the commanded brightness (confirmed by eye), and 12.5 after 50
          dimmed them. 🔬 Effect for GIDs 14, 10 and 0 not reported. No state message, no error
      - sent: '`z` 250 instead of `g`; `bri` 10 and 50; `cct` 3000 and 5000; `fade` 800'
        result: 'Worked the same as `e:56`: brightness and color temperature followed (confirmed by eye). So `e:57`
          accepts a zone address as well as a GID'
      x-seen:
        as: command on `cmd`
        text: Direct control. Sent to GIDs 100, 14, 10 and 0, and to zone 250 with `z`. To GID 100 and to zone 250
          the lights followed the command (confirmed by eye); the effect for the other GIDs is not reported. No
          state message or error was published
    heartbeat:
      name: heartbeat
      title: Heartbeat
      summary: Heartbeat
      description: 'Liveness message with several shapes, by source: the PowerPlane, the PDM, controller nodes (GIDs
        100, 101 and 0) and a wall switch.'
      x-code: 139
      x-seen:
        as: status
        text: Periodic heartbeat from the PowerPlane and the PDM; irregular ones from controller nodes and a wall
          switch (section 5.1)
      payload:
        oneOf:
        - $ref: '#/components/schemas/PowerPlaneHeartbeat'
        - $ref: '#/components/schemas/PdmHeartbeat'
        - $ref: '#/components/schemas/ControllerHeartbeat'
        - $ref: '#/components/schemas/SwitchHeartbeat'
      examples:
      - name: PowerPlane
        payload: {e: 139, g: 1, hsn: <hsn>, swv: 01.00.02, hwv: '01.00', time: 300737, heap: 6181804}
      - name: PDM
        payload: {e: 139, g: 2, bay: 3, hsn: <hsn>, swv: 01.00.12m, hwv: '02.05', time: 60182, heap: 8480948, temp: 31.5,
          rh: 35.71}
      - name: Controller
        payload:
          e: 139
          g: 100
          opc: 2
          mode: 3
          12v: 1
          term: 1
          heap: 13416
          txrx:
          - 165
          - 0
          - 278
          - 165
          uptime: 75
          temp: 30.6
      - name: Controller GID 101
        payload:
          e: 139
          g: 101
          opc: 2
          mode: 3
          12v: 1
          term: 1
          heap: 13448
          txrx:
          - 485
          - 0
          - 113
          - 485
          uptime: 35995
          temp: 30.41
      - name: Controller GID 0
        payload:
          e: 139
          g: 0
          opc: 2
          mode: 3
          12v: 1
          term: 1
          heap: 13520
          txrx:
          - 485
          - 292
          - 408
          - 485
          uptime: 35994
          temp: 29.04
      - name: Wall switch
        payload:
          e: 139
          g: 12
          uirgb: '#0000FF'
          term: 1
          heap: 13384
