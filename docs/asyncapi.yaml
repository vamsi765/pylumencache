    systemInfo:
      name: systemInfo
      x-model: false   # nested free-form data; the parser returns it as a SystemInfo wrapper
      title: System information
      summary: System information
      description: Published once after the system connects, before the device list. The name and address fields
        are personal data when filled in.
      payload:
        type: object
        required: [sys]
        properties:
          sys:
            type: string
            description: System ID. Likely stable; to be confirmed
          meta:
            type: object
            required: []
            properties:
              plt:
                type: string
              cat:
                type: integer
              sys_info:
                type: object
                required: []
                properties:
                  sys:
                    type: string
                  name:
                    type: string
                  addr1:
                    type: string
                  addr2:
                    type: string
                  zip:
                    type: string
                  phone:
                    type: string
                  note:
                    type: string
                  cat:
                    type: integer
              org_info:
                type: object
                required: []
                properties:
                  org:
                    type: integer
                  name:
                    type: string
                  cat:
                    type: integer
      examples:
      - payload:
          sys: <sys>
          meta:
            plt: ''
            cat: 0
            sys_info:
              sys: <sys>
              name: ''
              addr1: ''
              addr2: ''
              zip: ''
              phone: ''
              note: ''
              cat: 2
            org_info:
              org: 65535
              name: ''
              cat: 1
    deviceAnnouncement:
      name: deviceAnnouncement
      title: Device announcement
      summary: Device announcement
      description: 'One message per device, published once after the system connects. The topic path mirrors the
        wiring: each segment is <type>:<gid>. The PowerPlane''s message has no hsn.'
      payload:
        type: object
        required: [gid]
        properties:
          gid:
            $ref: '#/components/schemas/Gid'
          hsn:
            $ref: '#/components/schemas/Hsn'
          name:
            type: string
          cat:
            type: integer
            description: 'Device category: 32 PowerPlane, 35 PDM, 36 socket, 37 socket card, 40 wall switch'
          parent:
            type: integer
            description: GID of the parent device; 65535 for none, 0 not yet assigned
          time:
            type: integer
            description: Unknown; not a clock
      examples:
      - payload: {gid: 14, hsn: <hsn>, name: SC-CC2-50W, cat: 37, parent: 4, time: 1505366}
    emptyMessage:
      name: emptyMessage
      title: Empty message
      summary: Empty message
      description: Published on cmd 0.14 to 0.4 s after the broker echo of every command, even for GIDs that do
        not exist. Not a success acknowledgement; meaning unknown.
      payload: {type: string, maxLength: 0}
      examples:
