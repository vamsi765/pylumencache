    zoneEvent:
      name: zoneEvent
      title: Zone event
      summary: Zone event
      description: A zone turned on or off, usually by a wall switch. The "on" form carries brightness and color
        temperature.
      x-code: 56
      x-seen:
        as: status; command on `cmd`
        text: 'Zone on/off/brightness/color event. Sent as a command to zone 250 it worked: brightness and color
          temperature followed, with the fade (confirmed by eye); no reply'
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 56
          z:
            $ref: '#/components/schemas/ZoneId'
          'on':
            enum:
            - 0
            - 1
            description: 0 off, 1 on
          bri:
            $ref: '#/components/schemas/Brightness'
          cct:
            $ref: '#/components/schemas/ColorTemperature'
          dev:
            type: integer
            description: GID of the device that caused the event (a switch). Inferred
          g:
            type: integer
            description: 65534 in every event; meaning unknown
      examples:
      - name: 'off'
        payload: {e: 56, z: 250, 'on': 0, dev: 12, g: 65534}
      - name: 'on'
        payload: {e: 56, z: 250, 'on': 1, bri: 100, cct: 5000, dev: 12, g: 65534}
    errorReport:
      name: errorReport
      title: Error report
      summary: Error report
      description: Published on both status and errors with the same payload. The meaning of the codes is unknown.
      x-code: 254
      x-seen:
        as: status and `errors`
        text: Error report. Seen once, shortly after a restart
      payload:
        type: object
        required: [e]
        properties:
          e:
            const: 254
          g:
            type: integer
            description: 100 in the one report seen; not a GID in the inventory
          err:
            type: integer
          v:
            type: integer
      examples:
      - payload: {e: 254, g: 100, err: 38, v: 254}
